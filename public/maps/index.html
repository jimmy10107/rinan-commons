<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>日南九里互動地圖｜日南稻站</title><script>
// GitHub Pages 保留 /maps/，Vercel 會正規化為 /maps。從目前網址建立
// 明確的資源根目錄，避免瀏覽器把地圖檔案錯誤解析到網站根目錄。
window.RINAN_MAP_BASE = `${location.pathname.replace(/\/index\.html$/, '').replace(/\/$/, '')}/`;
document.write(`<link rel="stylesheet" href="${window.RINAN_MAP_BASE}vendor/leaflet.css"><link rel="stylesheet" href="${window.RINAN_MAP_BASE}map.css"><script defer src="${window.RINAN_MAP_BASE}vendor/leaflet.js"><\/script><script defer src="${window.RINAN_MAP_BASE}map.js"><\/script>`);
</script></head>
<body><main class="map-app"><aside class="panel"><header><span class="eyebrow">EXPLORE RINAN</span><h1>走進日南九里</h1><p>沿著海線，看見地方的輪廓。</p></header><details open id="controls"><summary>地圖控制與九里圖層</summary><div class="settings"><fieldset><legend>底圖</legend><div class="buttons"><button id="street" aria-pressed="true">街道地圖</button><button id="satellite" aria-pressed="false">衛星影像</button></div></fieldset><label class="opacity" for="opacity">里界填色透明度 <output id="opacity-value">42%</output></label><input id="opacity" type="range" min="0" max="100" value="42"><fieldset><legend>九里圖層 <small>勾選顯示，點里名定位</small></legend><div id="villages"></div></fieldset><button id="reset" class="reset">顯示九里・回到全區</button><label class="wheel"><input type="checkbox" id="wheel"> 啟用滑鼠滾輪縮放</label></div></details><footer><p><strong>3,787.05</strong> 公頃 <span>／</span> 外圍 <strong>32.77</strong> 公里</p><p class="source">依提供地圖標示：內政部國土測繪中心村（里）界線圖資（2021）。面積與周長沿用原檔，供地方認識參考。</p></footer></aside><section class="canvas" aria-label="日南地區互動地圖"><div id="map" tabindex="0" aria-label="日南九里地圖，可使用方向鍵移動、加減鍵縮放"></div><div class="map-caption"><span class="line"></span> 日南地區外圍界線 <span id="selection" aria-live="polite">九里全區</span></div><div id="status" role="status">正在載入里界資料…</div><div class="map-help">拖曳移動・＋／− 縮放・點里名定位</div></section></main><footer class="map-site-footer"><small>© 2026 <a href="https://www.rinancommons.com/">日南稻站 Rinan Commons</a>｜<a href="https://www.rinancommons.com/copyright/">版權聲明</a>｜保留所有權利</small></footer><noscript>互動地圖需要啟用 JavaScript 才能顯示。</noscript></body></html>
